<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="পড়া শুনি">
<meta name="theme-color" content="#0f7b5f">
<title>পড়া শুনি</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a63;--ac:#0f7b5f;--acx:#fff;--rec:#d6382f;--bd:#e3e1d8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--card:#202228;--tx:#eceae4;--mut:#9a988f;--ac:#36c39b;--acx:#08241b;--rec:#ff6b61;--bd:#32343c}}
:root[data-theme="dark"]{--bg:#15161a;--card:#202228;--tx:#eceae4;--mut:#9a988f;--ac:#36c39b;--acx:#08241b;--rec:#ff6b61;--bd:#32343c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:4px 0 2px}p.s{color:var(--mut);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:12px}
.recwrap{text-align:center}
#rec{width:84px;height:84px;border-radius:50%;border:0;background:var(--rec);color:#fff;font-size:30px;cursor:pointer}
#rec.on{animation:p 1.1s infinite}@keyframes p{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--rec) 25%,transparent)}}
#tm{margin-top:8px;color:var(--mut);font-size:14px;min-height:21px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row label{flex:1 1 120px;font-size:13px;color:var(--mut)}
select{width:100%;padding:9px;margin-top:4px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}.item.cur .nm{color:var(--ac);font-weight:700}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}.nm small{display:block;color:var(--mut);font-weight:400}
button.b{border:0;border-radius:10px;padding:9px 13px;font:inherit;cursor:pointer;background:var(--ac);color:var(--acx)}
button.g{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#st{position:sticky;bottom:8px;background:var(--ac);color:var(--acx);border-radius:12px;padding:10px 14px;display:none;justify-content:space-between;align-items:center;gap:10px}
.empty{color:var(--mut);text-align:center;padding:14px 0}

/* ── PWA ইনস্টল ব্যানার ── */
.pwa-banner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);
  width:calc(100% - 28px);max-width:532px;background:var(--card);border:1px solid var(--ac);border-radius:14px;
  padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:500;box-shadow:0 4px 20px rgba(0,0,0,.35);font-family:inherit}
.pwa-t{font-size:.9rem;font-weight:700;color:var(--tx);margin-bottom:2px}
.pwa-s{font-size:.75rem;color:var(--mut);line-height:1.5}.pwa-s b{color:var(--tx)}
.pwa-go{background:var(--ac);color:var(--acx);border:none;border-radius:9px;padding:8px 14px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.pwa-x{background:transparent;border:none;color:var(--mut);font-size:1rem;cursor:pointer;padding:4px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.85rem;z-index:600;box-shadow:0 3px 12px rgba(0,0,0,.3);max-width:90%;text-align:center}
</style>
</head>
<body>
<main>
<h1>🎧 পড়া শুনি</h1>
<p class="s">একবার নিজের গলায় পড়া রেকর্ড করুন, তারপর বারবার শুনুন।</p>

<div class="card recwrap">
  <input type="text" id="name" placeholder="পড়ার নাম (যেমন: বাংলা – সন্ধি)">
  <button id="rec" aria-label="রেকর্ড">🎙️</button>
  <div id="tm">বাটনে চাপ দিয়ে বলা শুরু করুন</div>
</div>

<div class="card">
  <div class="row">
    <label>কতবার পুনরাবৃত্তি
      <select id="rep"><option>1</option><option>3</option><option selected>5</option><option>10</option><option>20</option><option value="0">অসীম ∞</option></select></label>
    <label>দুই বারের মাঝে বিরতি
      <select id="gap"><option value="0">নেই</option><option value="2" selected>২ সেকেন্ড</option><option value="5">৫ সেকেন্ড</option><option value="10">১০ সেকেন্ড</option></select></label>
    <label>গতি
      <select id="spd"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select></label>
  </div>
</div>

<div class="card">
  <div class="top"><strong>আমার পড়াসমূহ</strong><button class="b" id="all">▶ সব পরপর চালাও</button></div>
  <div id="list"></div>
</div>
<div id="st"><span id="stt"></span><button class="b g" id="stop" style="color:inherit;border-color:currentColor">⏹ থামাও</button></div>
</main>

<script>
const $=id=>document.getElementById(id);
const bn=n=>Number(n).toLocaleString('bn-BD');
let db=null,items=[],mem=[];
// ---- storage (IndexedDB, falls back to memory) ----
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('porashuno',1);
q.onupgradeneeded=()=>q.result.createObjectStore('a',{keyPath:'id'});
q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function dbAll(){return new Promise(r=>{if(!db)return r(mem);try{const q=db.transaction('a').objectStore('a').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r(mem)}catch(e){r(mem)}})}
function dbPut(o){if(!db){mem.push(o);return Promise.resolve()}return new Promise(r=>{try{const t=db.transaction('a','readwrite');t.objectStore('a').put(o);t.oncomplete=r;t.onerror=()=>{mem.push(o);r()}}catch(e){mem.push(o);r()}})}
function dbDel(id){mem=mem.filter(x=>x.id!==id);if(!db)return Promise.resolve();return new Promise(r=>{try{const t=db.transaction('a','readwrite');t.objectStore('a').delete(id);t.oncomplete=r;t.onerror=r}catch(e){r()}})}
async function load(){items=(await dbAll()).sort((a,b)=>a.id-b.id);render()}
// ---- list ----
function render(){const l=$('list');
if(!items.length){l.innerHTML='<div class="empty">এখনো কিছু রেকর্ড করা হয়নি</div>';return}
l.innerHTML='';items.forEach((it,i)=>{const d=document.createElement('div');d.className='item'+(i===cur&&playing?' cur':'');
d.innerHTML='<div class="nm"></div><button class="b">▶</button><button class="b g">🗑</button>';
d.firstChild.innerHTML='<span></span><small></small>';d.firstChild.firstChild.textContent=it.name;
d.firstChild.lastChild.textContent=bn(Math.round(it.dur||0))+' সেকেন্ড';
d.children[1].onclick=()=>play(i,false);
d.children[2].onclick=async()=>{if(confirm('মুছে ফেলবেন?')){if(playing&&cur===i)stop();await dbDel(it.id);load()}};
l.appendChild(d)})}
// ---- recording ----
let mr,chunks=[],t0,tick,stream;
function mime(){for(const m of['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'])if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;return''}
$('rec').onclick=async()=>{
if(mr&&mr.state==='recording'){mr.stop();return}
try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){$('tm').textContent='মাইক্রোফোনের অনুমতি দিন (ব্রাউজারের অ্যাড্রেস বারে)';return}
stop();chunks=[];const m=mime();mr=new MediaRecorder(stream,m?{mimeType:m}:undefined);
mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
mr.onstop=async()=>{clearInterval(tick);stream.getTracks().forEach(t=>t.stop());
$('rec').classList.remove('on');$('rec').textContent='🎙️';
const blob=new Blob(chunks,{type:mr.mimeType||m||'audio/webm'});const dur=(Date.now()-t0)/1000;
if(dur<1){$('tm').textContent='অনেক ছোট হয়েছে, আবার চেষ্টা করুন';return}
const nm=$('name').value.trim()||('পড়া '+bn(items.length+1));
await dbPut({id:Date.now(),name:nm,blob,dur});$('name').value='';$('tm').textContent='✅ সেভ হয়েছে';load()};
mr.start();t0=Date.now();$('rec').classList.add('on');$('rec').textContent='⏹';
tick=setInterval(()=>$('tm').textContent='রেকর্ড হচ্ছে… '+bn(Math.floor((Date.now()-t0)/1000))+' সেকেন্ড (থামাতে আবার চাপুন)',250)};
// ---- playback ----
const au=new Audio();let cur=-1,rep=0,playing=false,allMode=false,timer=null,url=null;
const N=()=>+$('rep').value,GAP=()=>+$('gap').value*1000;
function status(){const s=$('st');if(!playing){s.style.display='none';return}
s.style.display='flex';const n=N();
$('stt').textContent='▶ '+items[cur].name+' — '+bn(rep+1)+(n?' / '+bn(n):' বার')}
function start(){if(!items[cur])return stop();if(url)URL.revokeObjectURL(url);
url=URL.createObjectURL(items[cur].blob);au.src=url;au.playbackRate=+$('spd').value;
au.play().catch(()=>{});status()}
function play(i,all){clearTimeout(timer);cur=i;rep=0;allMode=all;playing=true;render();start()}
function stop(){clearTimeout(timer);au.pause();playing=false;if(url){URL.revokeObjectURL(url);url=null}status();render()}
au.onended=()=>{rep++;const n=N();
if(n===0||rep<n){timer=setTimeout(start,GAP());return}
if(allMode){timer=setTimeout(()=>{cur=(cur+1)%items.length;rep=0;render();start()},GAP());return}
stop()};
$('spd').onchange=()=>{au.playbackRate=+$('spd').value};
$('stop').onclick=stop;
$('all').onclick=()=>{if(!items.length)return;play(0,true)};
if('mediaSession'in navigator)try{navigator.mediaSession.setActionHandler('pause',stop)}catch(e){}
function toast(msg,err){const t=document.createElement('div');t.className='toast';t.textContent=msg;if(err)t.style.background='#c0392b',t.style.color='#fff';document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
openDB().then(load);
</script>
<script>
/* ══════════════════════════════════════
   SERVICE WORKER — Offline support
   অ্যাপটি নিজেই cache হবে, offline-এও চলবে
══════════════════════════════════════ */
/* ══════════════════════════════════════
   ONLINE/OFFLINE TOAST
   NOTE: Single HTML file-এ Service Worker রেজিস্ট্রেশন সম্ভব নয়
   (Chrome blob:/data: URL block করে)।
   অফলাইন কাজ করে localStorage caching দিয়ে — SW ছাড়াই।
══════════════════════════════════════ */
(function(){
  /* ── Service Worker Registration ──
     ফিক্স: আগে '/daily-study/sw.js' হার্ডকোড ছিল, তাই অন্য ফোল্ডার/ডোমেইনে
     রেজিস্ট্রেশন ব্যর্থ হতো → Chrome ইনস্টল প্রম্পটও আসত না।
     এখন রিলেটিভ পাথ — যেখানেই রাখুন, কাজ করবে। */
  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        console.log('SW registered:', reg.scope);
        // নতুন version পাওয়া গেলে জানাও
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          nw.addEventListener('statechange', () => {
            if(nw.state === 'installed' && navigator.serviceWorker.controller){
              toast('🔄 নতুন আপডেট আছে — পেজ রিলোড করুন');
            }
          });
        });
      })
      .catch(err => console.warn('SW failed:', err));
  }

  /* ── Online / Offline Toast ── */
  function showNetToast(msg, isErr){
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;top:56px;left:50%;transform:translateX(-50%);background:'+(isErr?'#e67e22':'#3ecf8e')+';color:#fff;padding:7px 16px;border-radius:9px;font-size:.75rem;font-family:inherit;z-index:9999;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.3);pointer-events:none';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }
  window.addEventListener('online',  () => showNetToast('✅ ইন্টারনেট ফিরে এসেছে'));
  window.addEventListener('offline', () => showNetToast('📴 অফলাইন মোড — cache থেকে চলছে', true));
  if(!navigator.onLine){
    window.addEventListener('DOMContentLoaded', () =>
      showNetToast('📴 অফলাইন — আগের ডেটা দিয়ে চলছে', true)
    );
  }
})()
</script>

<script>
/* ══════════════════════════════════════
   PWA — ম্যানিফেস্ট, সার্ভিস ওয়ার্কার ও ইনস্টল প্রম্পট
   ─────────────────────────────────────
   আগের সমস্যা যা ঠিক করা হয়েছে:
   ১. start_url/scope/icon path হার্ডকোড ছিল "/daily-study/" —
      অন্য ফোল্ডার বা ডোমেইনে হলে ম্যানিফেস্ট অচল হয়ে যেত।
      এখন বর্তমান URL থেকে অটোমেটিক তৈরি হয়।
   ২. আইকন ফাইল না থাকলে (404) Chrome ইনস্টল প্রম্পট দেয় না।
      এখন আইকন canvas দিয়ে তৈরি হয়ে data: URL হিসেবে যায় —
      কোনো আলাদা ফাইল লাগে না।
   ৩. কোনো সার্ভিস ওয়ার্কার ছিল না। Chrome/Android-এ fetch handler সহ
      সার্ভিস ওয়ার্কার ছাড়া beforeinstallprompt ইভেন্টই আসে না।
      পাশে sw.js থাকলে এখন রেজিস্টার হয়।
   ৪. iPhone/Safari-তে beforeinstallprompt কখনোই আসে না —
      এখন ম্যানুয়াল নির্দেশনা দেখানো হয়।
   ৫. একবার ✕ চাপলে ব্যানার আর কখনো আসত না — এখন ৭ দিন পরে ফিরে আসে।
══════════════════════════════════════ */

/* ── ১. আইকন তৈরি (canvas → PNG data URL) ── */
function _makeIcon(size){
  try{
    const c=document.createElement('canvas'); c.width=c.height=size;
    const x=c.getContext('2d'); if(!x) return null;
    x.fillStyle='#0f7b5f'; x.fillRect(0,0,size,size);
    const r=size*0.30;
    x.beginPath(); x.arc(size/2,size/2,r,0,Math.PI*2);
    x.fillStyle='#ffffff'; x.fill();
    x.fillStyle='#0f7b5f';
    x.font='bold '+Math.round(size*0.34)+'px "SolaimanLipi","Noto Sans Bengali",sans-serif';
    x.textAlign='center'; x.textBaseline='middle';
    x.fillText('প', size/2, size/2+size*0.02);
    return c.toDataURL('image/png');
  }catch(e){ return null; }
}

/* ── iOS হোম স্ক্রিন আইকন ── */
(function(){ const u=_makeIcon(180); if(!u) return; const l=document.createElement('link'); l.rel='apple-touch-icon'; l.href=u; document.head.appendChild(l); })();

/* ── ২. ম্যানিফেস্ট ── */
(function(){
  // পাশে আসল manifest.json থাকলে সেটাই সবচেয়ে ভালো — আগে সেটা চেষ্টা করো
  const link=document.createElement('link');
  link.rel='manifest'; link.href='manifest.json';
  document.head.appendChild(link);

  function buildInline(){
    const dir=new URL('.', location.href).href;   // বর্তমান ফোল্ডার — হার্ডকোড নয়
    const icons=[];
    const i192=_makeIcon(192), i512=_makeIcon(512);
    if(i192) icons.push({src:i192,sizes:'192x192',type:'image/png',purpose:'any'});
    if(i512) icons.push({src:i512,sizes:'512x512',type:'image/png',purpose:'any'});
    if(i512) icons.push({src:i512,sizes:'512x512',type:'image/png',purpose:'maskable'});
    const manifest={
      name:'পড়া শুনি', short_name:'পড়া শুনি',
      description:'নিজের গলায় পড়া রেকর্ড করে বারবার শুনুন',
      start_url:location.href.split('#')[0],
      scope:dir,
      display:'standalone', background_color:'#0f7b5f', theme_color:'#0f7b5f',
      lang:'bn', icons
    };
    try{
      const url=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
      link.href=url;
    }catch(e){}
  }

  // manifest.json আছে কিনা যাচাই — না থাকলে ইনলাইনে তৈরি করো
  if(location.protocol==='file:'){ buildInline(); return; }
  fetch('manifest.json',{cache:'no-store'})
    .then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(m=>{ if(!m||!m.icons||!m.icons.length) throw 0; })
    .catch(()=>buildInline());
})();

/* ── ৪. ইনস্টল প্রম্পট ── */
let pwaInstallEvent = null;
let _pwaBannerShown = false;

function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true
      || document.referrer.startsWith('android-app://');
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
/* যতক্ষণ পর্যন্ত অ্যাপ হিসেবে ইনস্টল না হচ্ছে, ততক্ষণ প্রতিটি রিলোডে
   ব্যানার আবার দেখানো হবে — ✕ চাপলে শুধু এই সেশনের (এই পেজ-লোডের) জন্য বন্ধ হয়,
   পরের রিলোডে আবার আসবে। শুধু isStandalone()-ই চিরস্থায়ীভাবে বন্ধ করে। */
function pwaDismissed(){ return false; }

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  pwaInstallEvent = e;
  setTimeout(()=>showInstallBanner('auto'), 3000);
});

window.addEventListener('appinstalled', ()=>{
  pwaInstallEvent=null;
  const b=document.getElementById('pwaBanner'); if(b) b.remove();
  toast('✅ ইনস্টল হয়েছে! হোম স্ক্রিন থেকে খুলুন');
});

/* mode: 'auto' = আসল প্রম্পট আছে | 'ios' | 'manual' = নির্দেশনা */
function showInstallBanner(mode){
  if(_pwaBannerShown) return;
  if(isStandalone()) return;            // ইতিমধ্যেই অ্যাপ হিসেবে চলছে
  if(pwaDismissed()) return;
  if(mode==='auto' && !pwaInstallEvent) return;
  if(document.getElementById('pwaBanner')) return;
  _pwaBannerShown = true;

  let body, btn;
  if(mode==='auto'){
    body='PWA হিসেবে অ্যাপের মতো খুলবে';
    btn='<button onclick="doInstallPWA()" class="pwa-go">ইনস্টল</button>';
  } else if(mode==='ios'){
    body='নিচের <b>শেয়ার</b> <span style="font-size:.9em">⬆️</span> বাটন চাপুন → <b>Add to Home Screen</b>';
    btn='';
  } else {
    body='ব্রাউজার মেনু <b>⋮</b> খুলুন → <b>Install app</b> / <b>Add to Home screen</b>';
    btn='';
  }

  const banner = document.createElement('div');
  banner.id = 'pwaBanner';
  banner.className = 'pwa-banner';
  banner.innerHTML = `
    <span style="font-size:1.4rem">📲</span>
    <div style="flex:1">
      <div class="pwa-t">হোম স্ক্রিনে ইনস্টল করুন</div>
      <div class="pwa-s">${body}</div>
    </div>
    ${btn}
    <button onclick="dismissInstall()" class="pwa-x">✕</button>`;
  document.body.appendChild(banner);
}

async function doInstallPWA(){
  if(!pwaInstallEvent){ toast('ব্রাউজার মেনু ⋮ → Install app ব্যবহার করুন', true); return; }
  try{
    pwaInstallEvent.prompt();
    const result = await pwaInstallEvent.userChoice;
    if(result && result.outcome === 'accepted') toast('✅ ইনস্টল হচ্ছে…');
  }catch(e){
    toast('ইনস্টল করা গেল না — মেনু ⋮ → Install app দেখুন', true);
  }
  pwaInstallEvent = null;
  const banner = document.getElementById('pwaBanner');
  if(banner) banner.remove();
}

function dismissInstall(){
  // এই সেশনের জন্যই শুধু বন্ধ — পরের রিলোডে আবার দেখানো হবে (ইনস্টল না করা পর্যন্ত)
  const banner = document.getElementById('pwaBanner');
  if(banner) banner.remove();
}

/* beforeinstallprompt না এলে (iOS Safari, সার্ভিস ওয়ার্কার নেই,
   বা ব্রাউজার সাপোর্ট করে না) — ৮ সেকেন্ড পরে ম্যানুয়াল নির্দেশনা */
window.addEventListener('load', ()=>{
  setTimeout(()=>{
    if(pwaInstallEvent) return;          // আসল প্রম্পট এসে গেছে
    if(isStandalone() || pwaDismissed()) return;
    if(location.protocol==='file:') return;
    showInstallBanner(isIOS() ? 'ios' : 'manual');
  }, 8000);
});

/* ডায়াগনস্টিক — কনসোলে pwaDebug() লিখলে কী কী বাকি আছে দেখাবে */
async function pwaDebug(){
  const out={
    'HTTPS বা localhost': location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname),
    'ইতিমধ্যে ইনস্টল করা': isStandalone(),
    'ম্যানিফেস্ট লিংক': !!document.querySelector('link[rel=manifest]'),
    'সার্ভিস ওয়ার্কার সাপোর্ট': 'serviceWorker' in navigator,
    'সার্ভিস ওয়ার্কার রেজিস্টার্ড': false,
    'beforeinstallprompt পাওয়া গেছে': !!pwaInstallEvent,
    'iOS (ম্যানুয়াল লাগবে)': isIOS(),
    'এই সেশনে ব্যানার বন্ধ করা হয়েছে': _pwaBannerShown && !document.getElementById('pwaBanner')
  };
  if('serviceWorker' in navigator){
    try{ const r=await navigator.serviceWorker.getRegistrations(); out['সার্ভিস ওয়ার্কার রেজিস্টার্ড']=r.length>0; }catch(e){}
  }
  console.table(out); return out;
}
</script>
